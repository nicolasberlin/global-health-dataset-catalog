# Example for the internal EPFL HTTP deployment.
# Merge into the external Traefik STATIC configuration.
# With this container port, publish host port 1312 as "1312:80".
# Preserve the existing web address if Traefik already serves HTTP on port 1312.
# Do not enable HTTP-to-HTTPS redirection or default TLS on this entrypoint.
entryPoints:
  web:
    address: ":80"

providers:
  docker:
    exposedByDefault: false
    network: traefik
