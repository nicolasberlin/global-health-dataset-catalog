# Public-session API and PostgreSQL. For personal local use, run scripts/start_api.py.
name: global-health-api
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-global_health}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-global_health}
      API_AUTH_MODE: ${API_AUTH_MODE:?Set API_AUTH_MODE=public for this deployment}
      API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN:?Set API_PUBLIC_ORIGIN}
      API_SESSION_SECRET: ${API_SESSION_SECRET:?Set API_SESSION_SECRET}
      API_ALLOW_INSECURE_HTTP_SESSIONS: ${API_ALLOW_INSECURE_HTTP_SESSIONS:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      RCP_DEEPSEEK_API_KEY: ${RCP_DEEPSEEK_API_KEY:?Set RCP_DEEPSEEK_API_KEY}
      RCP_GEMMA_MEDITRON_API_KEY: ${RCP_GEMMA_MEDITRON_API_KEY:?Set RCP_GEMMA_MEDITRON_API_KEY}
      RCP_APERTUS_MEDITRON_API_KEY: ${RCP_APERTUS_MEDITRON_API_KEY:?Set RCP_APERTUS_MEDITRON_API_KEY}
      RCP_DEEPSEEK_MODEL: ${RCP_DEEPSEEK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-0731}
      RCP_GEMMA_MEDITRON_MODEL: ${RCP_GEMMA_MEDITRON_MODEL:-EPFLiGHT/Gemma-3-27B-MeditronFO}
      RCP_APERTUS_MEDITRON_MODEL: ${RCP_APERTUS_MEDITRON_MODEL:-EPFLiGHT/Apertus-70B-MeditronFO}
      SEARCH_MAX_CONCURRENCY: ${SEARCH_MAX_CONCURRENCY:-1}
      SEARCH_MAX_ACTIVE: ${SEARCH_MAX_ACTIVE:-100}
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-65536}
      API_REQUEST_BODY_TIMEOUT_SECONDS: ${API_REQUEST_BODY_TIMEOUT_SECONDS:-30}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-5000}
      DATABASE_MIGRATE_ON_STARTUP: ${DATABASE_MIGRATE_ON_STARTUP:-true}
      WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-10}
      CLASSIFICATION_MAX_CONCURRENCY: ${CLASSIFICATION_MAX_CONCURRENCY:-2}
      COLLECTION_MAX_CONCURRENCY: ${COLLECTION_MAX_CONCURRENCY:-2}
      COLLECTION_BROWSER_URL: ${COLLECTION_BROWSER_URL:-}
      COLLECTION_BROWSER_TOKEN: ${COLLECTION_BROWSER_TOKEN:-}
      COLLECTION_DATAVERSE_HOSTS: ${COLLECTION_DATAVERSE_HOSTS:-dataverse.harvard.edu,dataverse.unc.edu}
      COLLECTION_ZENODO_HOSTS: ${COLLECTION_ZENODO_HOSTS:-zenodo.org}
      COLLECTION_BROWSER_HOSTS: ${COLLECTION_BROWSER_HOSTS:-dataverse.harvard.edu}
      COLLECTION_MAX_DURATION_SECONDS: ${COLLECTION_MAX_DURATION_SECONDS:-300}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      LLM_INVALID_MAX_ATTEMPTS: ${LLM_INVALID_MAX_ATTEMPTS:-2}
      LLM_RETRY_WINDOW_SECONDS: ${LLM_RETRY_WINDOW_SECONDS:-120}
      API_PUBLIC_SESSIONS_PER_IP_PER_MINUTE: ${API_PUBLIC_SESSIONS_PER_IP_PER_MINUTE:-20}
      API_PUBLIC_SEARCHES_PER_IP_PER_MINUTE: ${API_PUBLIC_SEARCHES_PER_IP_PER_MINUTE:-30}
      API_PUBLIC_CLASSIFICATIONS_PER_IP_PER_MINUTE: ${API_PUBLIC_CLASSIFICATIONS_PER_IP_PER_MINUTE:-60}
      API_PUBLIC_ONLINE_SEARCHES_PER_DAY: ${API_PUBLIC_ONLINE_SEARCHES_PER_DAY:-500}
      API_PUBLIC_WORK_ITEMS_PER_DAY: ${API_PUBLIC_WORK_ITEMS_PER_DAY:-500}
      API_PUBLIC_MAX_ACTIVE_WORK_ITEMS: ${API_PUBLIC_MAX_ACTIVE_WORK_ITEMS:-100}
      API_PUBLIC_MAX_CANDIDATES_PER_SEARCH: ${API_PUBLIC_MAX_CANDIDATES_PER_SEARCH:-10}
      API_SEARCH_REQUESTS_PER_MINUTE: ${API_SEARCH_REQUESTS_PER_MINUTE:-10}
      API_CLASSIFICATION_REQUESTS_PER_MINUTE: ${API_CLASSIFICATION_REQUESTS_PER_MINUTE:-20}
      EGRESS_BLOCKED_CIDRS: ${EGRESS_BLOCKED_CIDRS:-}
    networks: [default, browser-control]
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8001}:8001"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  collection-browser:
    profiles: [browser]
    build:
      context: .
      dockerfile: browser/Dockerfile
    environment:
      COLLECTION_BROWSER_TOKEN: ${COLLECTION_BROWSER_TOKEN:-}
      COLLECTION_BROWSER_HOSTS: ${COLLECTION_BROWSER_HOSTS:-dataverse.harvard.edu}
      EGRESS_BLOCKED_CIDRS: ${EGRESS_BLOCKED_CIDRS:-}
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt:
      - no-new-privileges:true
      - seccomp=./browser/seccomp_profile.json
    networks: [browser-control, browser-egress]
    mem_limit: 1g
    pids_limit: 256
    shm_size: 256m
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    labels:
      - traefik.enable=false

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-global_health}
      POSTGRES_USER: ${POSTGRES_USER:-global_health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - api-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-global_health} -d ${POSTGRES_DB:-global_health}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  api-postgres-data:

networks:
  browser-control:
    internal: true
  browser-egress: {}
