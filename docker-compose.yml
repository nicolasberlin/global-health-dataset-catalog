services:
  ai-commons-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --workers
      - "1"
      - --root-path
      - /ai-commons/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-global_health}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the application}@postgres:5432/${POSTGRES_DB:-global_health}
      RCP_DEEPSEEK_API_KEY: ${RCP_DEEPSEEK_API_KEY:?Set RCP_DEEPSEEK_API_KEY before starting the application}
      RCP_DEEPSEEK_MODEL: ${RCP_DEEPSEEK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-0731}
      RCP_GEMMA_MEDITRON_API_KEY: ${RCP_GEMMA_MEDITRON_API_KEY:?Set RCP_GEMMA_MEDITRON_API_KEY before starting the application}
      RCP_APERTUS_MEDITRON_API_KEY: ${RCP_APERTUS_MEDITRON_API_KEY:?Set RCP_APERTUS_MEDITRON_API_KEY before starting the application}
      RCP_GEMMA_MEDITRON_MODEL: ${RCP_GEMMA_MEDITRON_MODEL:-EPFLiGHT/Gemma-3-27B-MeditronFO}
      RCP_APERTUS_MEDITRON_MODEL: ${RCP_APERTUS_MEDITRON_MODEL:-EPFLiGHT/Apertus-70B-MeditronFO}
      API_AUTH_MODE: ${API_AUTH_MODE:?Set API_AUTH_MODE=public for this deployment}
      API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN:?Set API_PUBLIC_ORIGIN}
      API_SESSION_SECRET: ${API_SESSION_SECRET:?Set API_SESSION_SECRET}
      API_ALLOW_INSECURE_HTTP_SESSIONS: ${API_ALLOW_INSECURE_HTTP_SESSIONS:-false}
      # Trust only verified proxy peer addresses, never arbitrary client forwarding headers.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      API_PUBLIC_SESSIONS_PER_IP_PER_MINUTE: ${API_PUBLIC_SESSIONS_PER_IP_PER_MINUTE:-20}
      API_PUBLIC_SEARCHES_PER_IP_PER_MINUTE: ${API_PUBLIC_SEARCHES_PER_IP_PER_MINUTE:-30}
      API_PUBLIC_CLASSIFICATIONS_PER_IP_PER_MINUTE: ${API_PUBLIC_CLASSIFICATIONS_PER_IP_PER_MINUTE:-60}
      API_PUBLIC_ONLINE_SEARCHES_PER_DAY: ${API_PUBLIC_ONLINE_SEARCHES_PER_DAY:-500}
      API_PUBLIC_WORK_ITEMS_PER_DAY: ${API_PUBLIC_WORK_ITEMS_PER_DAY:-500}
      API_PUBLIC_MAX_ACTIVE_WORK_ITEMS: ${API_PUBLIC_MAX_ACTIVE_WORK_ITEMS:-100}
      API_PUBLIC_MAX_CANDIDATES_PER_SEARCH: ${API_PUBLIC_MAX_CANDIDATES_PER_SEARCH:-10}
      API_SEARCH_REQUESTS_PER_MINUTE: ${API_SEARCH_REQUESTS_PER_MINUTE:-10}
      API_CLASSIFICATION_REQUESTS_PER_MINUTE: ${API_CLASSIFICATION_REQUESTS_PER_MINUTE:-20}
      API_SOURCE_CREATION_REQUESTS_PER_MINUTE: ${API_SOURCE_CREATION_REQUESTS_PER_MINUTE:-10}
      SEARCH_MAX_CONCURRENCY: ${SEARCH_MAX_CONCURRENCY:-1}
      SEARCH_MAX_ACTIVE: ${SEARCH_MAX_ACTIVE:-100}
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-65536}
      API_REQUEST_BODY_TIMEOUT_SECONDS: ${API_REQUEST_BODY_TIMEOUT_SECONDS:-30}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-5000}
      DATABASE_MIGRATE_ON_STARTUP: ${DATABASE_MIGRATE_ON_STARTUP:-true}
      WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-10}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS-http://localhost:5173,http://127.0.0.1:5173}
      CLASSIFICATION_MAX_CONCURRENCY: ${CLASSIFICATION_MAX_CONCURRENCY:-2}
      COLLECTION_MAX_CONCURRENCY: ${COLLECTION_MAX_CONCURRENCY:-2}
      COLLECTION_BROWSER_URL: ${COLLECTION_BROWSER_URL:-}
      COLLECTION_BROWSER_TOKEN: ${COLLECTION_BROWSER_TOKEN:-}
      COLLECTION_DATAVERSE_HOSTS: ${COLLECTION_DATAVERSE_HOSTS:-dataverse.harvard.edu,dataverse.unc.edu}
      COLLECTION_ZENODO_HOSTS: ${COLLECTION_ZENODO_HOSTS:-zenodo.org}
      COLLECTION_BROWSER_HOSTS: ${COLLECTION_BROWSER_HOSTS:-dataverse.harvard.edu}
      COLLECTION_MAX_DURATION_SECONDS: ${COLLECTION_MAX_DURATION_SECONDS:-300}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      LLM_INVALID_MAX_ATTEMPTS: ${LLM_INVALID_MAX_ATTEMPTS:-2}
      LLM_RETRY_WINDOW_SECONDS: ${LLM_RETRY_WINDOW_SECONDS:-120}
      EGRESS_BLOCKED_CIDRS: ${EGRESS_BLOCKED_CIDRS:-}
    # Bootstrap installs the firewall, then drops all capabilities and root.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traefik
      - database
      - browser-control
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.ai-commons-api.entrypoints=web
      - traefik.http.routers.ai-commons-api.rule=Host(`${PUBLIC_HOST:?Set PUBLIC_HOST before starting the application}`) && PathPrefix(`/ai-commons/api`)
      - traefik.http.routers.ai-commons-api.priority=100
      - traefik.http.middlewares.strip-ai-commons-api.stripprefix.prefixes=/ai-commons/api
      # Default source criterion is the direct client IP seen by Traefik.
      - traefik.http.middlewares.limit-ai-commons-api.ratelimit.average=${TRAEFIK_API_RATE_AVERAGE:-200}
      - traefik.http.middlewares.limit-ai-commons-api.ratelimit.period=1s
      - traefik.http.middlewares.limit-ai-commons-api.ratelimit.burst=${TRAEFIK_API_RATE_BURST:-400}
      - traefik.http.middlewares.body-ai-commons-api.buffering.maxrequestbodybytes=${API_MAX_REQUEST_BODY_BYTES:-65536}
      - traefik.http.routers.ai-commons-api.middlewares=limit-ai-commons-api,body-ai-commons-api,strip-ai-commons-api
      - traefik.http.services.ai-commons-api.loadbalancer.server.port=8001


  collection-browser:
    profiles: [browser]
    build:
      context: .
      dockerfile: browser/Dockerfile
    environment:
      COLLECTION_BROWSER_TOKEN: ${COLLECTION_BROWSER_TOKEN:-}
      COLLECTION_BROWSER_HOSTS: ${COLLECTION_BROWSER_HOSTS:-dataverse.harvard.edu}
      EGRESS_BLOCKED_CIDRS: ${EGRESS_BLOCKED_CIDRS:-}
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt:
      - no-new-privileges:true
      - seccomp=./browser/seccomp_profile.json
    networks: [browser-control, browser-egress]
    mem_limit: 1g
    pids_limit: 256
    shm_size: 256m
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    labels:
      - traefik.enable=false

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-global_health}
      POSTGRES_USER: ${POSTGRES_USER:-global_health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting PostgreSQL}
    networks:
      - database
      - browser-control
    labels:
      - traefik.enable=false
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-global_health}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

networks:
  browser-control:
    internal: true
  browser-egress: {}
  database:
    internal: true
  traefik:
    external: true
    name: traefik
