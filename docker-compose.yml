services:
  ai-commons:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /ai-commons/api
        VITE_PUBLIC_BASE: /ai-commons/
        VITE_API_AUTH_MODE: ${API_AUTH_MODE:-token}
    depends_on:
      - ai-commons-api
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.ai-commons.entrypoints=web
      - traefik.http.routers.ai-commons.rule=Host(`${PUBLIC_HOST:?Set PUBLIC_HOST before starting the application}`) && PathPrefix(`/ai-commons`)
      - traefik.http.routers.ai-commons.priority=10
      - traefik.http.middlewares.strip-ai-commons.stripprefix.prefixes=/ai-commons
      - traefik.http.routers.ai-commons.middlewares=strip-ai-commons
      - traefik.http.services.ai-commons.loadbalancer.server.port=5173

  ai-commons-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-global_health}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the application}@postgres:5432/${POSTGRES_DB:-global_health}
      RCP_DEEPSEEK_API_KEY: ${RCP_DEEPSEEK_API_KEY:?Set RCP_DEEPSEEK_API_KEY before starting the application}
      RCP_DEEPSEEK_MODEL: ${RCP_DEEPSEEK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-0731}
      RCP_GEMMA_MEDITRON_API_KEY: ${RCP_GEMMA_MEDITRON_API_KEY:?Set RCP_GEMMA_MEDITRON_API_KEY before starting the application}
      RCP_APERTUS_MEDITRON_API_KEY: ${RCP_APERTUS_MEDITRON_API_KEY:?Set RCP_APERTUS_MEDITRON_API_KEY before starting the application}
      RCP_GEMMA_MEDITRON_MODEL: ${RCP_GEMMA_MEDITRON_MODEL:-EPFLiGHT/Gemma-3-27B-MeditronFO}
      RCP_APERTUS_MEDITRON_MODEL: ${RCP_APERTUS_MEDITRON_MODEL:-EPFLiGHT/Apertus-70B-MeditronFO}
      API_AUTH_MODE: ${API_AUTH_MODE:-token}
      API_ACCESS_TOKENS: ${API_ACCESS_TOKENS:-}
      API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN:-}
      API_SESSION_SECRET: ${API_SESSION_SECRET:-}
      API_ALLOW_INSECURE_HTTP_SESSIONS: ${API_ALLOW_INSECURE_HTTP_SESSIONS:-false}
      # Trust only verified proxy peer addresses, never arbitrary client forwarding headers.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      API_SEARCH_REQUESTS_PER_MINUTE: ${API_SEARCH_REQUESTS_PER_MINUTE:-10}
      API_CLASSIFICATION_REQUESTS_PER_MINUTE: ${API_CLASSIFICATION_REQUESTS_PER_MINUTE:-20}
      API_SOURCE_CREATION_REQUESTS_PER_MINUTE: ${API_SOURCE_CREATION_REQUESTS_PER_MINUTE:-10}
      CLASSIFICATION_MAX_CONCURRENCY: ${CLASSIFICATION_MAX_CONCURRENCY:-2}
      COLLECTION_MAX_CONCURRENCY: ${COLLECTION_MAX_CONCURRENCY:-2}
      EGRESS_BLOCKED_CIDRS: ${EGRESS_BLOCKED_CIDRS:-}
    # Bootstrap installs the firewall, then drops all capabilities and root.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traefik
      - database
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.ai-commons-api.entrypoints=web
      - traefik.http.routers.ai-commons-api.rule=Host(`${PUBLIC_HOST:?Set PUBLIC_HOST before starting the application}`) && PathPrefix(`/ai-commons/api`)
      - traefik.http.routers.ai-commons-api.priority=100
      - traefik.http.middlewares.strip-ai-commons-api.stripprefix.prefixes=/ai-commons/api
      - traefik.http.routers.ai-commons-api.middlewares=strip-ai-commons-api
      - traefik.http.services.ai-commons-api.loadbalancer.server.port=8001

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-global_health}
      POSTGRES_USER: ${POSTGRES_USER:-global_health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting PostgreSQL}
    networks:
      - database
    labels:
      - traefik.enable=false
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-global_health}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

networks:
  database:
    internal: true
  traefik:
    external: true
    name: traefik
